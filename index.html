<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#14223a; --muted:#5d6a7e; --line:#e1e6ee;
    --brand:#14284b; --brand-2:#1e3a6b; --brand-soft:#e7edf7; --accent:#d31f2b;
    --ok:#1c7c4a; --ok-soft:#e6f4ec; --warn:#b35c00; --warn-soft:#fdf0e1;
    --bad:#b3261e; --bad-soft:#fbe9e8; --info:#4b47b0; --info-soft:#eceafb;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  #app{max-width:1150px;margin:0 auto;padding:16px}
  .loading{padding:60px 16px;text-align:center;color:var(--muted)}
  h1{font-size:19px;margin:0;line-height:1.2}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:15px;margin:0 0 8px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grow{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-block}
  .btn:hover{border-color:#c3ccd8}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-2)}
  .btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--bad);border-color:#f0c9c6}
  .btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn.link{border:none;background:none;color:var(--brand-2);padding:4px 6px}
  .btn:disabled{opacity:.5;cursor:default}
  input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],input[type=number],input[type=url],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
  /* encabezado institucional */
  .hero{background:var(--brand);color:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-40px;bottom:-30px;width:220px;height:26px;background:var(--accent);transform:rotate(-8deg);opacity:.9}
  .hero .brandmark{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .hero .sub{font-size:12.5px;opacity:.85;font-weight:500;letter-spacing:.02em}
  .hero .kicker{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;padding:2px 8px;border-radius:4px;margin-bottom:3px}
  .hero .btn{position:relative;z-index:1}
  .logoimg{width:56px;height:56px;border-radius:50%;flex:none;background-color:#fff}
  .kiosk .logoimg{width:64px;height:64px}
  .tabs{display:flex;gap:4px;background:#e5e9f0;padding:4px;border-radius:11px;margin-bottom:16px;overflow-x:auto}
  .tab{border:none;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  /* tablas */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;background:#f8f9fb}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#f7f9fc}
  tr.baja td{opacity:.6}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-info{background:var(--info-soft);color:var(--info)}
  .p-mute{background:#eef0f4;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted);font-weight:500}
  .daybtn{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;font-size:12px;font-weight:600;cursor:pointer;padding:0}
  .daybtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef0f4;border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
  .chip button{border:none;background:#dde2e9;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;padding:0}
  .note{background:var(--brand-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;color:#1c3358}
  .warnbox{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;color:#7a3f00}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14223a;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}
  .editrow td{background:#fafbfd}
  .editgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  textarea.csv{width:100%;height:140px;font-family:ui-monospace,monospace;font-size:12px}
  /* vista del maestro */
  .kiosk{max-width:480px;margin:0 auto}
  .result{text-align:center;padding:30px 20px}
  .bigicon{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:42px;font-weight:700}
  .bigicon.ok{background:var(--ok-soft);color:var(--ok)}
  .bigicon.warn{background:var(--warn-soft);color:var(--warn)}
  .bigicon.info{background:var(--brand-soft);color:var(--brand)}
  .bigtime{font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
  .who{font-size:18px;font-weight:700;margin-bottom:4px}
  .todayline{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:14px}
  .todayline div b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .qrbox{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .qrbox canvas{border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
  .legal{font-size:12.5px;color:var(--muted);line-height:1.5}
  @media (max-width:640px){
    #app{padding:12px}
    .card{padding:14px}
    .hide-sm{display:none}
    .logoimg{width:46px;height:46px}
    h1{font-size:16px}
  }
</style>
</head>

<script>

        ${pv.rangos.map((r, i) => `<div class="editgrid" style="margin-bottom:8px"><label class="f">Desde<input type="date" name="desde_${i}" value="${r[0]}" required></label><label class="f">Hasta<input type="date" name="hasta_${i}" value="${r[1]}" required></label>
          <span class="muted small" style="padding-bottom:9px">${esc(fmtRango(r[0], r[1]))} · ${diasLaborablesEn(r[0], r[1])} día(s) de lunes a viernes</span></div>`).join('')}
        <div class="editgrid">
          <label class="f">Tipo<select name="tipo">${TIPOS.map(([id, nom]) => `<option value="${id}" ${pv.tipo === id ? 'selected' : ''}>${esc(nom)}</option>`).join('')}</select></label>
          <label class="f grow" style="min-width:240px">Motivo (aparece en el reporte y en el Excel)<input type="text" name="motivo" value="${esc(pv.motivo)}" required></label>
        </div>
        <div style="margin-top:10px"><div class="f" style="font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px">Aplica a</div>
          <label style="margin-right:16px"><input type="radio" name="aplica" value="todos" ${pv.maestros.length ? '' : 'checked'} data-act="aplica"> Todos los maestros <span class="muted small">(el día no cuenta como laborable)</span></label>
          <label><input type="radio" name="aplica" value="algunos" ${pv.maestros.length ? 'checked' : ''} data-act="aplica"> Solo algunos <span class="muted small">(sus faltas quedan justificadas)</span></label>
          <div id="listaM" class="chips" style="margin-top:8px;${pv.maestros.length ? '' : 'display:none'}">${ms.map(m => `<label class="chip" style="padding-right:11px;cursor:pointer"><input type="checkbox" name="m" value="${esc(m.id)}" ${pv.maestros.includes(m.id) ? 'checked' : ''}> ${esc(m.nombre)}</label>`).join('') || '<span class="muted small">No hay maestros activos</span>'}</div>
        </div>
        <div class="row" style="margin-top:14px"><button class="btn primary" type="submit" ${S.busy ? 'disabled' : ''}>Guardar${pv.rangos.length > 1 ? ` (${pv.rangos.length} periodos)` : ''}</button><button class="btn" type="button" data-act="cancelPrev">Cancelar</button></div>
      </form>`;
    }
    const lista = (D().periodos || []);
    const hoy = D().hoy;
    const fila = p => {
      const aplica = p.maestros ? p.maestros.map(id => (maestroById(id) || {}).nombre || 'Maestro eliminado').join(', ') : 'Todos los maestros';
      return `<tr><td style="white-space:nowrap"><b>${esc(fmtRango(p.desde, p.hasta))}</b></td><td>${esc(p.motivo)}${p.texto ? `<div class="muted small">“${esc(p.texto)}”</div>` : ''}</td>
        <td class="small">${p.maestros ? `<span class="pill p-warn">Algunos</span> ${esc(aplica)}` : '<span class="pill p-info">Todos</span>'}</td>
        <td class="small muted">${esc(p.creado_por || '')}${p.creado ? '<br>' + esc(fmtTs(p.creado)) : ''}</td>
        <td>${S.confirmPer === p.id ? `<div class="row" style="flex-wrap:nowrap"><button class="btn sm danger solid" data-act="quitarPerOk" data-id="${esc(p.id)}">Quitar</button><button class="btn sm" data-act="quitarPerNo">No</button></div>` : `<button class="btn sm danger" data-act="quitarPer" data-id="${esc(p.id)}">Quitar</button>`}</td></tr>`;
    };
    const proximos = lista.filter(p => p.hasta >= hoy), pasados = lista.filter(p => p.hasta < hoy);
    const tabla = (arr) => `<div class="tw"><table><thead><tr><th>Fechas</th><th>Motivo</th><th>Aplica a</th><th>Registró</th><th></th></tr></thead><tbody>${arr.map(fila).join('')}</tbody></table></div>`;
    return `<div class="card"><h2>Escribe la indicación</h2>
        <p class="muted small" style="margin-top:-6px">Escribe como lo dirías normalmente. El sistema entiende fechas sueltas, rangos y nombres de maestros, y te muestra lo que entendió antes de guardar. Las faltas de esos días se justifican solas, también las de quincenas pasadas. Cada registro guarda quién lo hizo; consulta todo en <b>Historial</b>.</p>
        <form id="fIndicacion" class="row" style="align-items:stretch"><textarea name="texto" rows="2" class="grow" style="min-width:260px;resize:vertical" placeholder="Ej. Del 20 de diciembre 2026 al 7 de enero 2027 son vacaciones">${esc(S.indicacion || '')}</textarea>
          <button class="btn primary" type="submit">Interpretar</button></form>
        <div class="chips" style="margin-top:8px">${ejemplos.map(e => `<button class="chip" style="border:none;cursor:pointer;padding-right:11px" data-act="ejemplo" data-k="${esc(e)}">${esc(e)}</button>`).join('')}</div>
        ${prevHtml}</div>
      <div class="card"><h2>Próximos y vigentes</h2>${proximos.length ? tabla(proximos) : '<p class="muted">No hay periodos próximos.</p>'}</div>
      ${pasados.length ? `<div class="card"><h2>Anteriores</h2>${tabla(pasados)}</div>` : ''}
      ${(D().periodos_anulados || []).length ? `<div class="card"><h2>Anulados</h2><p class="muted small" style="margin-top:-6px">Periodos que se quitaron. Se conservan como constancia.</p><div class="tw"><table><thead><tr><th>Fechas</th><th>Motivo</th><th>Aplicaba a</th><th>Registró</th><th>Anuló</th></tr></thead><tbody>
        ${D().periodos_anulados.map(p => `<tr class="baja"><td style="white-space:nowrap">${esc(fmtRango(p.desde, p.hasta))}</td><td>${esc(p.motivo)}</td><td class="small">${p.maestros ? esc(p.maestros.map(id => (maestroById(id) || {}).nombre || '—').join(', ')) : 'Todos'}</td>
          <td class="small">${esc(p.creado_por || '—')}<br>${esc(fmtTs(p.creado))}</td><td class="small"><b>${esc(p.anulado_por || '—')}</b><br>${esc(fmtTs(p.anulado))}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
  }

  const CATS = [['', 'Todo'], ['periodo', 'Vacaciones y permisos'], ['ajuste', 'Correcciones de días'], ['maestro', 'Maestros'], ['dispositivo', 'Celulares'], ['patron', 'Patrones'], ['config', 'Ajustes'], ['ips', 'Redes permitidas'], ['cuenta', 'Cuentas y contraseñas']];
  async function cargarHist(mas) {
    const f = S.histF || { categoria: '', usuario: '' };
    const lista = mas && S.hist ? S.hist : [];
    const datos = { categoria: f.categoria, usuario: f.usuario, limite: 200, antes_de: mas && lista.length ? lista[lista.length - 1].id : '' };
    try { const j = await api('bitacora', { datos }); S.hist = lista.concat(j.r); S.histFin = j.r.length < 200; render(); }
    catch (e) { if (!e.silent) toast(e.message); }
  }
  function viewHistorial() {
    if (S.hist == null) { S.hist = []; cargarHist(false); }
    const f = S.histF || { categoria: '', usuario: '' };
    const usuarios = [...new Set((S.hist || []).map(x => x.usuario).concat(f.usuario ? [f.usuario] : []))].filter(Boolean).sort();
    const rows = S.hist || [];
    return `<div class="card"><h2>Historial de cambios</h2>
      <p class="muted small" style="margin-top:-6px">Cada cambio en el panel queda registrado con el usuario, la fecha y la hora. Este historial no se puede borrar ni modificar, ni siquiera el administrador.</p>
      <div class="row"><select id="histCat">${CATS.map(([v, l]) => `<option value="${v}" ${f.categoria === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select id="histUsr"><option value="">Todos los usuarios</option>${usuarios.map(u => `<option ${f.usuario === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
      <div class="tw" style="margin-top:12px"><table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Cambio</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td class="small" style="white-space:nowrap">${esc(fmtTs(x.ts.slice(0, 16)))}</td><td class="small"><b>${esc(x.usuario || '—')}</b></td><td class="small">${esc(x.descripcion)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sin cambios registrados.</td></tr>'}
      </tbody></table></div>
      ${rows.length && !S.histFin ? '<p><button class="btn" data-act="histMas">Ver más</button></p>' : ''}</div>`;
  }

  function viewReporte() {
    const p = S.periodo;
    const ms = maestrosDePeriodo(p);
    if (!maestrosList().length) return cardPendientes() + `<div class="card"><h2>Aún no hay maestros</h2><p class="muted">Da de alta a los maestros en <b>Maestros y celulares</b> e imprime el QR de la entrada en <b>Código QR y patrones</b>.</p><button class="btn primary" data-act="tab" data-id="maestros">Agregar maestros</button></div>`;
    const idx = indices();
    if (S.sel && maestroById(S.sel)) return viewDetalle(S.sel, idx);
    const nav = `<div class="card"><div class="row between">
        <div class="row"><button class="btn sm" data-act="prev" aria-label="Quincena anterior">←</button>
        <div><div style="font-weight:700;font-size:16px">Quincena del ${esc(periodLabel(p))}</div><div class="muted small">Corte: ${esc(periodCorte(p))}${S.loading ? ' · actualizando…' : ''}</div></div>
        <button class="btn sm" data-act="next" aria-label="Quincena siguiente">→</button>
        <button class="btn sm link" data-act="hoy">Quincena actual</button></div>
        <div class="row">${variosPatrones() ? `<select id="selPatron" title="Patrón"><option value="0">Todos los patrones</option>${patronesActivos().map(pt => `<option value="${pt.id}" ${S.patronFiltro === pt.id ? 'selected' : ''}>${esc(nombrePatron(pt))}</option>`).join('')}</select>` : ''}
        <button class="btn red" data-act="xlsx">Descargar Excel</button></div></div>
        ${S.csvText != null ? `<div style="margin-top:12px"><div class="muted small" style="margin-bottom:6px">No se pudo descargar aquí. Copia este texto y pégalo en Excel:</div><textarea class="csv" readonly>${esc(S.csvText)}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="copycsv">Copiar</button><button class="btn sm link" data-act="closecsv">Cerrar</button></div></div>` : ''}
      </div>`;
    const today = D().hoy;
    let hoyCard = '';
    if (periodRange(p).keys.includes(today)) {
      const items = maestrosList(false).map(m => ({ m, info: dayInfo(m, today, (idx.rec[m.id] || {})[today], (idx.aj[m.id] || {})[today], today) }))
        .filter(x => !x.info.fuera && (x.info.laborable || x.info.asistencia));
      const presentes = items.filter(x => x.info.asistencia).length;
      hoyCard = `<div class="card"><div class="row between"><h3 style="margin:0">Hoy · ${fmtDay(today)}</h3><span class="muted small">${presentes} de ${items.length} han checado · actualizado ${esc((D().ahora || '').split(' ')[1] || '')}</span></div>
        <div class="chips" style="margin-top:10px">${items.map(x => `<span class="pill ${x.info.asistencia ? x.info.cls : 'p-mute'}" title="${esc(x.info.estado)}">${esc(x.m.nombre)} ${x.info.e ? '· ' + esc(x.info.e) : ''}${x.info.s ? '–' + esc(x.info.s) : ''}</span>`).join('') || '<span class="muted small">Nadie tiene jornada hoy.</span>'}</div></div>`;
    }
    const rows = ms.map(m => ({ m, r: resumen(m, p, idx) }));
    const tot = rows.reduce((a, { r }) => { for (const k in r.t) a[k] = (a[k] || 0) + r.t[k]; return a; }, {});
    const stats = `<div class="stats">
      <div class="stat"><span>Asistencias</span><b>${tot.asistencias || 0}</b></div>
      <div class="stat"><span>Retardos</span><b style="color:var(--warn)">${tot.retardos || 0}</b></div>
      <div class="stat"><span>Faltas</span><b style="color:var(--bad)">${tot.faltas || 0}</b></div>
      <div class="stat"><span>Sin salida</span><b>${tot.sinSalida || 0}</b></div>
      <div class="stat"><span>Horas trabajadas</span><b>${hm(tot.minutos || 0) || '0:00'}</b></div>
      <div class="stat"><span>Tiempo extra</span><b>${hm(tot.extra || 0) || '0:00'}</b></div></div>`;
    const table = `<div class="card"><h2>Resumen por maestro</h2><p class="muted small" style="margin-top:-6px">Toca un maestro para ver el detalle por día y corregir registros.</p><div class="tw"><table>
      <thead><tr><th>Maestro</th>${variosPatrones() ? '<th class="hide-sm">Patrón</th>' : ''}<th class="hide-sm">Horario</th><th class="num">Días lab.</th><th class="num">Asist.</th><th class="num">Retardos</th><th class="num hide-sm">Min. retardo</th><th class="num">Faltas</th><th class="num hide-sm">Justif.</th><th class="num hide-sm">Sin salida</th><th class="num">Horas</th><th class="num hide-sm">Extra</th></tr></thead>
      <tbody>${rows.map(({ m, r }) => `<tr class="click ${m.baja ? 'baja' : ''}" data-act="ver" data-id="${esc(m.id)}"><td><b>${esc(m.nombre)}</b>${m.baja ? ' <span class="pill p-mute">Baja</span>' : ''}</td>${variosPatrones() ? `<td class="hide-sm small">${esc(nombrePatron(patronById(m.patron_id)))}</td>` : ''}<td class="hide-sm">${esc(m.entrada || '—')}–${esc(m.salida || '—')}</td>
        <td class="num">${r.t.laborables}</td><td class="num">${r.t.asistencias}</td>
        <td class="num">${r.t.retardos ? `<span class="pill p-warn">${r.t.retardos}</span>` : 0}</td><td class="num hide-sm">${r.t.minRetardo}</td>
        <td class="num">${r.t.faltas ? `<span class="pill p-bad">${r.t.faltas}</span>` : 0}</td><td class="num hide-sm">${r.t.justificadas}</td>
        <td class="num hide-sm">${r.t.sinSalida}</td><td class="num">${hm(r.t.minutos) || '0:00'}</td><td class="num hide-sm">${hm(r.t.extra) || '0:00'}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted small" style="margin-bottom:0">Horas tomadas del servidor (hora de Durango). Tolerancia de entrada: ${cfg().tolerancia} min. Las faltas de hoy se cuentan cuando termina el día.</p></div>`;
    return cardPendientes() + nav + hoyCard + stats + table;
  }

  function viewDetalle(mid, idx) {
    const m = maestroById(mid);
    const p = S.periodo;
    const { dias, t } = resumen(m, p, idx);
    const ed = S.editDay;
    const rowsHtml = dias.map(d => {
      const corr = d.ajustado && (d.e !== d.eOrig || d.s !== d.sOrig) ? `<div class="muted small">Registrado: ${esc(d.eOrig || '—')}–${esc(d.sOrig || '—')}</div>` : '';
      const main = `<tr><td>${fmtDay(d.k)}</td><td>${esc(d.prog || '—')}–${esc(d.progS || '—')}</td><td><b>${esc(d.e || '—')}</b></td><td><b>${esc(d.s || '—')}</b>${corr}</td>
        <td><span class="pill ${d.cls}">${esc(d.estado)}</span>${d.sinSalida ? ' <span class="pill p-warn">Sin salida</span>' : ''}${d.anticipada ? ' <span class="pill p-warn">Salida anticipada</span>' : ''}${d.ajustado ? ` <span class="pill p-mute" title="${esc(d.nota)}">Corregido${d.ajPor ? ' por ' + esc(d.ajPor) : ''}</span>` : ''}</td>
        <td class="num">${d.trabajado != null ? hm(d.trabajado) : ''}</td><td class="num">${d.extra ? hm(d.extra) : ''}</td>
        <td><button class="btn sm" data-act="edit" data-k="${d.k}">${ed === d.k ? 'Editando' : 'Corregir'}</button></td></tr>`;
      if (ed !== d.k) return main;
      return main + `<tr class="editrow"><td colspan="8"><form id="fAjuste" class="editgrid">
          <label class="f">Entrada programada<input type="time" name="prog_e" value="${esc(d.prog)}"></label>
          <label class="f">Salida programada<input type="time" name="prog_s" value="${esc(d.progS)}"></label>
          <label class="f">Entrada<input type="time" name="e" value="${esc(d.e)}"></label>
          <label class="f">Salida<input type="time" name="s" value="${esc(d.s)}"></label>
          <label class="f" style="flex-direction:row;align-items:center;gap:6px;padding-bottom:8px"><input type="checkbox" name="j" ${d.j ? 'checked' : ''}> Justificado</label>
          <label class="f grow" style="min-width:220px">Motivo (obligatorio)<input type="text" name="motivo" required value="${esc(d.nota)}" placeholder="Ej. permiso, olvidó su celular, incapacidad…"></label>
          <div class="row"><button class="btn primary sm" type="submit" ${S.busy ? 'disabled' : ''}>Guardar</button><button class="btn sm" type="button" data-act="cancelEdit">Cancelar</button>${d.ajustado ? `<button class="btn sm danger" type="button" data-act="rmAjuste" data-k="${d.k}">Quitar corrección</button>` : ''}</div>
        </form><div class="muted small" style="margin-top:6px">La corrección queda documentada con su motivo y fecha; los escaneos originales no se borran y aparecen en el Excel.</div></td></tr>`;
    }).join('');
    return `<div class="card"><div class="row between"><div class="row"><button class="btn sm" data-act="back">← Todos</button>
        <div><div style="font-weight:700;font-size:16px">${esc(m.nombre)}${m.baja ? ' <span class="pill p-mute">Baja</span>' : ''}</div><div class="muted small">${variosPatrones() ? esc(nombrePatron(patronById(m.patron_id))) + ' · ' : ''}${m.num_empleado ? 'No. ' + esc(m.num_empleado) + ' · ' : ''}Horario ${esc(m.entrada || '—')}–${esc(m.salida || '—')} · ${(m.dias || [1,2,3,4,5]).map(x => DIAS[x]).join(', ')}</div></div></div>
        <div class="row"><button class="btn sm" data-act="prev">←</button><span class="small" style="font-weight:600">${esc(periodLabel(p))}</span><button class="btn sm" data-act="next">→</button></div></div></div>
      <div class="stats"><div class="stat"><span>Asistencias</span><b>${t.asistencias}/${t.laborables}</b></div><div class="stat"><span>Retardos</span><b style="color:var(--warn)">${t.retardos}</b></div><div class="stat"><span>Min. de retardo</span><b>${t.minRetardo}</b></div><div class="stat"><span>Faltas</span><b style="color:var(--bad)">${t.faltas}</b></div><div class="stat"><span>Horas</span><b>${hm(t.minutos) || '0:00'}</b></div><div class="stat"><span>Extra</span><b>${hm(t.extra) || '0:00'}</b></div></div>
      <div class="card"><div class="tw"><table><thead><tr><th>Día</th><th>Horario</th><th>Entrada</th><th>Salida</th><th>Estado</th><th class="num">Horas</th><th class="num">Extra</th><th></th></tr></thead>
      <tbody>${rowsHtml || '<tr><td colspan="8" class="muted">No hay días laborables en esta quincena.</td></tr>'}</tbody></table></div></div>`;
  }

  function viewMaestros() {
    const todos = maestrosList();
    const ms = todos.filter(m => S.verBajas || !m.baja);
    const nBajas = todos.filter(m => m.baja).length;
    const cels = {};
    for (const d of D().dispositivos) if (d.maestro_id) (cels[d.maestro_id] = cels[d.maestro_id] || []).push(d);
    const hoy = D().hoy;
    const add = `<div class="card"><h2>Agregar maestro</h2><form id="fAdd" class="editgrid">
        <label class="f grow" style="min-width:200px">Nombre completo<input type="text" name="nombre" required placeholder="Ej. María López Hernández"></label>
        <label class="f">No. de empleado<input type="text" name="num_empleado" style="width:110px"></label>
        <label class="f">Puesto<input type="text" name="puesto" value="Docente" style="width:130px"></label>
        <label class="f">Entrada<input type="time" name="entrada" value="07:00" required></label>
        <label class="f">Salida<input type="time" name="salida" value="14:00"></label>

      ${ms.length ? `<div class="tw" style="margin-top:10px"><table>

      ${ms.map(m => {

          : '<span class="pill p-mute">Sin celular</span>';

  // ---------- QR y cartel ----------
  function drawQR(canvas, text, size, margin) {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (typeof qrcode !== 'function') { ctx.fillStyle = '#5d6a7e'; ctx.font = '14px Inter, sans-serif'; ctx.fillText('No se pudo generar el QR', 16, size/2); return; }
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(); const cell = Math.floor((size - margin*2) / n); const off = Math.floor((size - cell*n) / 2);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(off + c*cell, off + r*cell, cell, cell);
  }
  const loadLogo = () => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = LOGO; });
  async function saveFile(data, filename) {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }
  async function descargarCartel() {

    ctx.fillStyle = '#14284b'; ctx.fillRect(0, 0, W, 330);
    ctx.fillStyle = '#d31f2b'; ctx.save(); ctx.translate(W - 420, 300); ctx.rotate(-0.08); ctx.fillRect(0, 0, 520, 46); ctx.restore();
    const logo = await loadLogo();
    if (logo) { ctx.save(); ctx.beginPath(); ctx.arc(190, 165, 125, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.clip(); ctx.drawImage(logo, 65, 40, 250, 250); ctx.restore(); }
    ctx.textAlign = 'left'; ctx.fillStyle = '#d31f2b'; ctx.fillRect(350, 92, 250, 52);
    ctx.fillStyle = '#fff'; ctx.font = '800 34px Inter, Arial, sans-serif'; ctx.fillText('SECUNDARIA', 366, 131);
    ctx.font = '800 60px Inter, Arial, sans-serif'; ctx.fillText('Colegio', 350, 210); ctx.fillText('Hispanoamericano', 350, 275);
    ctx.textAlign = 'center'; ctx.fillStyle = '#14223a'; ctx.font = '800 58px Inter, Arial, sans-serif'; ctx.fillText('Escanea al llegar y al salir', W/2, 440);
    const y = 480, qs = 800; const qc = document.createElement('canvas'); qc.width = qs; qc.height = qs; drawQR(qc, QR_URL, qs, 28);
    ctx.drawImage(qc, (W - qs)/2, y); ctx.strokeStyle = '#e1e6ee'; ctx.lineWidth = 4; ctx.strokeRect((W - qs)/2, y, qs, qs);
    ctx.textAlign = 'left'; ctx.font = '500 36px Inter, Arial, sans-serif'; ctx.fillStyle = '#14223a';
    ['1.  Abre la cámara de tu celular y apunta al código.', '2.  Toca el enlace que aparece. ¡Listo!', '3.  La 1.ª vez del día es tu entrada; la siguiente, tu salida.']
      .forEach((l, i) => ctx.fillText(l, 130, y + qs + 90 + i*62));
    ctx.fillStyle = '#5d6a7e'; ctx.font = '400 27px Inter, Arial, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Registro electrónico de jornada · Art. 132, fr. XXXIV, Ley Federal del Trabajo', W/2, H - 70);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    try { await saveFile(blob, 'QR-entrada-checador-Hispanoamericano.png'); } catch (e) { toast('No se pudo descargar aquí. Haz una captura de pantalla del código.'); }
  }

  function excelAoA(pt) {

  async function descargarExcel() {
    const p = S.periodo;
    const lista = S.patronFiltro ? [patronById(S.patronFiltro)] : patrones().filter(pt => pt.activo || maestrosDePeriodo(p, pt.id).length);
    const partes = lista.map(pt => ({ pt, ...excelAoA(pt) })).filter((x, i) => x.n || i === 0);
    const tsv = () => partes.flatMap(x => [...x.res, [], ...x.det, [], []]).map(r => r.map(v => String(v ?? '').replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    const suf = S.patronFiltro ? '_' + nombrePatron(patronById(S.patronFiltro)).replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g, '-') : '';
    const name = `Asistencia_Secundaria_Hispanoamericano_${p.y}-${pad(p.m+1)}_${p.h ? '2da' : '1ra'}_quincena${suf}.xlsx`;
    if (typeof XLSX === 'undefined') { S.csvText = tsv(); render(); return; }
    const wb = XLSX.utils.book_new();
    const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 8 } }, { s: { r: 5, c: 0 }, e: { r: 5, c: 12 } }];
    const usados = new Set();
    const hoja = base => { let n = base.replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31), i = 2; while (usados.has(n)) n = base.slice(0, 28) + ' ' + i++; usados.add(n); return n; };
    for (const x of partes) {
      const tag = partes.length > 1 ? ' ' + nombrePatron(x.pt) : '';
      const s1 = XLSX.utils.aoa_to_sheet(x.res); s1['!cols'] = [10, 30, 12, 13, 10, 10, 9, 10, 8, 10, 9, 10, 11, 10, 30].map(w => ({ wch: w })); s1['!merges'] = merges;
      const s2 = XLSX.utils.aoa_to_sheet(x.det); s2['!cols'] = [10, 30, 11, 6, 10, 10, 10, 10, 10, 9, 22, 12, 12, 10, 30, 18].map(w => ({ wch: w })); s2['!merges'] = merges;
      XLSX.utils.book_append_sheet(wb, s1, hoja('Resumen' + tag));
      XLSX.utils.book_append_sheet(wb, s2, hoja('Entradas' + tag));
    }
    const bit = [[cfg().escuela.toUpperCase()], [`Bitácora de cambios que afectan la quincena del ${periodLabel(p)}`], [], ['Fecha y hora', 'Usuario', 'Cambio']];
    for (const x of (D().bitacora_periodo || []).slice().reverse()) bit.push([x.ts, x.usuario, x.descripcion]);
    if (bit.length === 4) bit.push(['', '', 'Sin cambios registrados para esta quincena.']);
    const s3 = XLSX.utils.aoa_to_sheet(bit); s3['!cols'] = [{ wch: 20 }, { wch: 30 }, { wch: 110 }];
    XLSX.utils.book_append_sheet(wb, s3, hoja('Bitácora'));
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    try { await saveFile(new Blob([buf]), name); S.csvText = null; render(); }
    catch (e) { S.csvText = tsv(); render(); }
  }

      } catch (e) { S.busy = false; S.loginErr = e.message; render(); }
      return;
    }
    if (f.classList && f.classList.contains('fPatron')) {
      const id = +f.dataset.id;
      await op('patron_guardar', { id, nombre: g('nombre'), razon_social: g('razon_social'), rfc: g('rfc'), registro_patronal: g('registro_patronal'), domicilio: g('domicilio'), activo: id === 1 ? true : !!fd.get('activo') }, `Patrón ${id} guardado`);
      return;
    }
    if (f.id === 'fReset') {
      if (await cuenta('reset_password', { id: f.dataset.id, password: String(fd.get('password') || '') }, 'Contraseña restablecida. Compártela en persona.')) { S.resetFor = null; cargarUsuarios(); }
      return;
    }
    if (f.id === 'fIndicacion') {
      const texto = g('texto'); S.indicacion = texto;
      if (!texto) return;
      const r = interpretar(texto, D().hoy, maestrosList(false));
      if (!r.rangos.length) { S.prev = null; toast('No encontré fechas en la indicación. Ej.: "el 2 de noviembre" o "del 20 de diciembre al 7 de enero".'); return; }
      S.prev = { ...r, texto }; render(); return;
    }
    if (f.id === 'fPeriodo') {
      const pv = S.prev; if (!pv) return;
      const algunos = fd.get('aplica') === 'algunos';
      const maestros = algunos ? fd.getAll('m').map(String) : [];
      if (algunos && !maestros.length) { toast('Elige al menos un maestro'); return; }
      const motivo = g('motivo'); if (!motivo) { toast('Escribe el motivo'); return; }
      const items = pv.rangos.map((_, i) => ({ desde: g('desde_' + i), hasta: g('hasta_' + i) }));
      if (items.some(x => !x.desde || !x.hasta || x.hasta < x.desde)) { toast('Revisa las fechas'); return; }
      S.busy = true; render();
      try { for (const x of items) await api('op', { op: 'periodo_agregar', datos: { ...x, tipo: g('tipo'), motivo, maestros, texto: pv.texto } }); S.prev = null; S.indicacion = ''; S.busy = false; toast('Guardado. Las faltas de esos días quedan justificadas.'); await cargar(true); }
      catch (e) { S.busy = false; if (!e.silent) toast(e.message); else render(); }
      return;
    }
    if (f.id === 'fPass') {
      if (await cuenta('cambiar_password', { actual: String(fd.get('actual') || ''), nueva: String(fd.get('nueva') || '') }, 'Contraseña cambiada')) f.reset();
      return;
    }
    if (f.id === 'fUsuario') {
      if (await cuenta('agregar', { email: g('email'), nombre: g('nombre'), rol: g('rol'), password: String(fd.get('password') || '') }, 'Acceso otorgado')) { f.reset(); cargarUsuarios(); }
      return;
    }
    if (f.id === 'fAdd') {
      const nombre = g('nombre'); if (!nombre) return;
      if (await op('maestro_agregar', { nombre, num_empleado: g('num_empleado'), puesto: g('puesto'), entrada: g('entrada'), salida: g('salida'), alta: g('alta'), patron_id: g('patron_id') || (S.patronFiltro || 1) }, `${nombre} agregado`)) f.reset();
    } else if (f.id === 'fAjuste') {
      const motivo = g('motivo'); if (!motivo) { toast('Escribe el motivo de la corrección'); return; }
      if (await op('ajuste_guardar', { maestro_id: S.sel, fecha: S.editDay, prog_e: g('prog_e'), prog_s: g('prog_s'), e: g('e'), s: g('s'), justificado: !!fd.get('j'), motivo }, 'Corrección guardada')) { S.editDay = null; render(); }
    } else if (f.id === 'fBaja') {
      const d = g('baja'); if (!d) return; S.confirmBaja = null;
      await op('maestro_baja', { id: f.dataset.id, fecha: d }, 'Baja registrada. Sus registros se conservan.');
    } else if (f.id === 'fConfig') {
      await op('config_guardar', { escuela: g('escuela'), tolerancia: parseInt(g('tolerancia'), 10) || 0 }, 'Ajustes guardados');
    } else if (f.id === 'fIps') {
      const ips = g('ips').split(/[\s,]+/).filter(Boolean);
      await op('ips_guardar', { ips }, ips.length ? 'Red permitida guardada' : 'Se aceptan escaneos desde cualquier red');
    }
  });

  // ---------- arranque ----------
  async function start() {
    S.token = ls.get('chk_token');
    try { S.yo = JSON.parse(ls.get('chk_yo') || 'null'); } catch (e) { S.yo = null; }
    render();
    if (S.token) { await cargar(); try { const j = await api('cuenta', { op: 'yo', datos: {} }); S.yo = j.r; ls.set('chk_yo', JSON.stringify(S.yo)); render(); } catch (e) {} }
    setInterval(() => { if (S.token && !document.hidden && !S.busy && !S.editDay && S.tab === 'reporte') cargar(true); }, 60000);
  }
  render();
  start();
})();

</script>
</body>
